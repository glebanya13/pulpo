name: pulpo
description: "Monedero — control de gastos personal offline-first para Android e iOS."
publish_to: 'none'
version: 1.0.1+27

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  fl_chart: ^0.69.2
  lucide_flutter: ^1.28.0
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.19.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  local_auth: ^2.3.0
  local_auth_android: ^1.0.0
  local_auth_darwin: ^1.0.0
  crypto: ^3.0.6
  pdf: ^3.11.3
  archive: ^4.0.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  home_widget: ^0.8.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  http: ^1.2.2
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+2
  file_selector: ^1.0.3
  image_picker: ^1.2.3
  firebase_ai: ^2.3.0
  firebase_app_check: ^0.3.2+10
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: 2.4.13
  drift_dev: 2.21.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/icon_light.png
  image_path: assets/icon_light.png
  image_path_ios_dark_transparent: assets/icon_dark.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_dark.png
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_icon.png
  color_dark: "#000000"
  image_dark: assets/splash_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash_icon.png
    icon_background_color: "#FFFFFF"
    color_dark: "#000000"
    image_dark: assets/splash_icon.png
    icon_background_color_dark: "#000000"
  android: true
  ios: true
  web: false

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
