name: pulpo
description: "Pulpo — personal offline-first budget tracker for Android and iOS."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  fl_chart: ^0.69.2
  lucide_flutter: ^1.28.0
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.19.0
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: 2.4.13
  drift_dev: 2.21.0

flutter:
  uses-material-design: true

  assets:
    - assets/
