workflows:
  ios-release:
    name: Pulpo iOS Release

    integrations:
      app_store_connect: PULPO CODEMAGIC

    environment:
      flutter: 3.47.0
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pulpo.app

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA
        script: |
          set +e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== Xcode / Flutter errors ====="
            grep -E "error:|Error \(Xcode\)|fatal error|CreateUniversalBinary|Command .* failed|Provisioning|signing" \
              /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -120
            find /tmp -name "*flutter_ios_build*" -o -name "*xcresult*" 2>/dev/null | head
            ls -la /tmp/xcodebuild_logs 2>/dev/null || true
          fi
          exit $STATUS

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
