workflows:
  ios-release:
    name: Monedero iOS Release

    integrations:
      app_store_connect: PULPO CODEMAGIC

    environment:
      flutter: 3.47.0
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pulpo.app

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA
        script: |
          set +e
          LOG=/tmp/flutter_build_ipa.log
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "===== Flutter / Xcode errors (from build log) ====="
            grep -E "Error \(Xcode\)|error: |fatal error|Provisioning|entitlement|code sign|CreateUniversalBinary|Command .* failed|does not include|doesn't include|doesn't support|requires a provisioning" \
              "$LOG" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -160 || true
            echo "===== Entitlements in project ====="
            plutil -p ios/Runner/Runner.entitlements 2>/dev/null || cat ios/Runner/Runner.entitlements
            echo "===== Signing identities ====="
            security find-identity -v -p codesigning 2>/dev/null | tail -20 || true
          fi
          exit $STATUS

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
